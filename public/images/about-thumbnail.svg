<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#1a2332"/>
  <rect x="20" y="20" width="1240" height="680" rx="20" fill="none" stroke="#a8c4e8" stroke-width="3" opacity="0.9"/>
  <!-- gold quote top -->
  <text x="235" y="300" font-family="Georgia, serif" font-size="140" fill="url(#gold)" opacity="0.95">“</text>
  <text x="325" y="300" font-family="Georgia, serif" font-size="140" fill="url(#gold)" opacity="0.95">“</text>
  <!-- gold frame -->
  <path d="M 350 220 H 980 A 30 30 0 0 1 1010 250 V 580" fill="none" stroke="#c9a86a" stroke-width="3" opacity="0.9"/>
  <path d="M 965 540 H 295 A 30 30 0 0 1 265 510 V 320" fill="none" stroke="#c9a86a" stroke-width="3" opacity="0.9"/>
  <!-- About me text -->
  <text x="640" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="78" font-weight="700" fill="url(#goldText)">About me</text>
  <!-- bottom quotes -->
  <text x="985" y="560" font-family="Georgia, serif" font-size="140" fill="url(#gold)" opacity="0.95">”</text>
  <text x="1075" y="560" font-family="Georgia, serif" font-size="140" fill="url(#gold)" opacity="0.95">”</text>
  <!-- sparkle bottom right -->
  <g transform="translate(1180,640)" opacity="0.5">
    <path d="M0 -15 L4 -4 L15 0 L4 4 L0 15 L-4 4 L-15 0 L-4 -4 Z" fill="#94a3b8"/>
  </g>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a86a"/>
      <stop offset="100%" stop-color="#f0d9a0"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8935f"/>
      <stop offset="50%" stop-color="#f5e6b8"/>
      <stop offset="100%" stop-color="#c9a86a"/>
    </linearGradient>
  </defs>
</svg>
